name: Proto CI

on:
    push:
        branches:
            - main
        paths:
            - ".github/workflows/proto-ci.yml"
            - ".github/workflows/release.yml"
            - "CHANGELOG.md"
            - "buf.yaml"
            - "Makefile"
            - "release.config.cjs"
            - "scripts/ci/**"
            - "**/*.proto"
            - "**/*.yml"
            - "**/*.yaml"
            - "!README.md"
    pull_request:
        paths:
            - ".github/workflows/proto-ci.yml"
            - ".github/workflows/release.yml"
            - "CHANGELOG.md"
            - "buf.yaml"
            - "Makefile"
            - "release.config.cjs"
            - "scripts/ci/**"
            - "**/*.proto"
            - "**/*.yml"
            - "**/*.yaml"
            - "!README.md"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    proto:
        name: Buf
        runs-on: ubuntu-latest
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version: "1.26.4"

            # actions/cache v6.1.0
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              id: gobin-buf
              with:
                  path: ~/go/bin
                  key: ${{ runner.os }}-gobin-buf-${{ hashFiles('.github/workflows/proto-ci.yml') }}

            - name: Install buf
              if: steps.gobin-buf.outputs.cache-hit != 'true'
              run: go install github.com/bufbuild/buf/cmd/buf@v1.71.0

            - name: Lint protobuf
              run: ./scripts/ci/proto-lint.sh

            - name: Check protobuf format
              run: ./scripts/ci/proto-format-check.sh

            - name: Check breaking changes
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  PROTO_BREAKING_BASE_BRANCH: ${{ github.event.repository.default_branch }}
                  PROTO_ALLOW_BREAKING_MESSAGE: "[allow-breaking-api]"
              run: |
                  git config --global --add safe.directory "$(pwd)"
                  if [ "${GITHUB_EVENT_NAME}" = "push" ] &&
                     git log -1 --pretty=%B | grep -Fq "${PROTO_ALLOW_BREAKING_MESSAGE}"; then
                      PROTO_ALLOW_BREAKING=true
                  else
                      PROTO_ALLOW_BREAKING=false
                  fi
                  export PROTO_ALLOW_BREAKING
                  ./scripts/ci/proto-breaking.sh
