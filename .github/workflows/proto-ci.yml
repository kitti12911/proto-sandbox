name: Proto CI

on:
    push:
        branches:
            - main
        paths:
            - ".github/workflows/proto-ci.yml"
            - ".github/workflows/release.yml"
            - "CHANGELOG.md"
            - "buf.yaml"
            - "Makefile"
            - "release.config.cjs"
            - "scripts/ci/**"
            - "**/*.proto"
            - "**/*.yml"
            - "**/*.yaml"
            - "!README.md"
    pull_request:
        paths:
            - ".github/workflows/proto-ci.yml"
            - ".github/workflows/release.yml"
            - "CHANGELOG.md"
            - "buf.yaml"
            - "Makefile"
            - "release.config.cjs"
            - "scripts/ci/**"
            - "**/*.proto"
            - "**/*.yml"
            - "**/*.yaml"
            - "!README.md"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    proto:
        name: Buf
        runs-on: ubuntu-latest
        container:
            image: ${{ vars.IMAGE_TOOLCHAIN_IMAGE }}
            credentials:
                username: ${{ secrets.TOOLCHAIN_REGISTRY_USERNAME }}
                password: ${{ secrets.TOOLCHAIN_REGISTRY_PASSWORD }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            - name: Lint protobuf
              run: ./scripts/ci/proto-lint.sh

            - name: Check protobuf format
              run: ./scripts/ci/proto-format-check.sh

            - name: Check breaking changes
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  PROTO_BREAKING_BASE_BRANCH: ${{ github.event.repository.default_branch }}
                  PROTO_ALLOW_BREAKING_MESSAGE: "[allow-breaking-api]"
              run: |
                  git config --global --add safe.directory "$(pwd)"
                  if [ "${GITHUB_EVENT_NAME}" = "push" ] &&
                     git log -1 --pretty=%B | grep -Fq "${PROTO_ALLOW_BREAKING_MESSAGE}"; then
                      PROTO_ALLOW_BREAKING=true
                  else
                      PROTO_ALLOW_BREAKING=false
                  fi
                  export PROTO_ALLOW_BREAKING
                  ./scripts/ci/proto-breaking.sh
