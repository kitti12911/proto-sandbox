stages:
    - lint
    - release

workflow:
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH == "main"'
        - when: never

variables:
    GIT_DEPTH: "0"
    GITLAB_AMD64_RUNNER_TAG: "solution-principle.gitlab-bu8-sd"

markdownlint:
    stage: lint
    image: $CI_RELEASE_TOOLCHAIN_IMAGE
    tags:
        - $GITLAB_AMD64_RUNNER_TAG
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          changes: &markdown_changes
              - ".gitlab-ci.yml"
              - ".markdownlint-cli2.*"
              - ".markdownlint.*"
              - "scripts/ci/markdownlint.sh"
              - "**/*.md"
              - "**/*.markdown"
        - if: '$CI_COMMIT_BRANCH == "main"'
          changes: *markdown_changes
    script:
        - ./scripts/ci/markdownlint.sh

proto:
    stage: lint
    image: $CI_IMAGE_TOOLCHAIN_IMAGE
    tags:
        - $GITLAB_AMD64_RUNNER_TAG
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          changes: &proto_changes
              - ".gitlab-ci.yml"
              - ".github/workflows/proto-ci.yaml"
              - ".github/workflows/release.yml"
              - "CHANGELOG.md"
              - "buf.yaml"
              - "Makefile"
              - "release.config.cjs"
              - "scripts/ci/**"
              - "**/*.proto"
              - "**/*.yml"
              - "**/*.yaml"
        - if: '$CI_COMMIT_BRANCH == "main"'
          changes: *proto_changes
    script:
        - ./scripts/ci/proto-lint.sh
        - ./scripts/ci/proto-format-check.sh
        - |
            if [ "${CI_PIPELINE_SOURCE}" = "push" ] &&
               git log -1 --pretty=%B | grep -Fq "[allow-breaking-api]"; then
                export PROTO_ALLOW_BREAKING=true
            else
                export PROTO_ALLOW_BREAKING=false
            fi
            export PROTO_BREAKING_BASE_BRANCH="${CI_DEFAULT_BRANCH:-main}"
            ./scripts/ci/proto-breaking.sh

release:publish:
    stage: release
    image: $CI_RELEASE_TOOLCHAIN_IMAGE
    tags:
        - $GITLAB_AMD64_RUNNER_TAG
    needs:
        - job: proto
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'
          changes: *proto_changes
    script:
        - git fetch --tags --force
        - |
            token="${GL_TOKEN:-${GITLAB_TOKEN:-}}"
            if [ -z "${token}" ]; then
                echo "GL_TOKEN or GITLAB_TOKEN is required for GitLab semantic-release." >&2
                exit 2
            fi
            git remote set-url origin "https://oauth2:${token}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        - ./scripts/ci/semantic-release-publish.sh --no-ci
